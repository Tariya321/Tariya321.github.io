baseURL = 'https://tariya321.github.io/'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh-cn'
title = 'Tariya321'
theme = 'PaperMod'
# theme = 'eureka'


[menu]

  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 50
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 30

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "Tariya321"
  description = "芯片、硬件与效率工具的实践记录"
  author = "Tariya321"
  avatar = "https://github.com/Tariya321.png?size=160"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  disableSpecial1stPost = true

  [params.assets]
    theme_color = "#0f766e"

  [params.homeInfoParams]
    Title = "Tariya321 的知识与实践记录"
    Content = "芯片与硬件设计 · AI 加速器 · EDA · Linux/macOS\n\n把实验、配置与复盘整理成可复用的公开笔记。"
    Kicker = "公开知识库 / 实践记录"
    AlignSocialIconsTo = "center"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Tariya321"
    title = "GitHub"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"
    title = "RSS"
